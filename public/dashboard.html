<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
  <main class="main">
<header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title">Dashboard <span id="Dashboard"></span></h1>
        <p class="page-subtitle" id="currentDate"></p>
      </div>
      
      <!-- <div class="topbar-search">
        <div class="search-wrapper">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="globalSearchInput" placeholder="Search tasks by title or course..." />
        </div>
      </div> -->
      
      <div class="topbar-right">
        <button class="btn-add-task">
          <i class="fa-solid fa-plus"></i>
          New Task
        </button>
        <a href="login.html" class="action-btn delete topbar-nav-btn" id="logoutLink">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
        </a>
      </div>
    </header>
<div class="top-dashboard-row">

  <section class="summary-cards">
    <div class="card card--total">
      <div class="card-icon"><i class="fa-solid fa-layer-group"></i></div>
      <div class="card-body">
        <span class="card-label">Total Tasks</span>
        <span class="card-value" id="countTotal">4</span>
      </div>
      <div class="card-trend" id="trendTotal"></div>
    </div>

    <div class="card card--pending">
      <div class="card-icon"><i class="fa-solid fa-hourglass-start"></i></div>
      <div class="card-body">
        <span class="card-label">Pending</span>
        <span class="card-value" id="countPending">2</span>
      </div>
      <div class="card-trend neutral">Not started yet</div>
    </div>

    <div class="card card--progress">
      <div class="card-icon"><i class="fa-solid fa-spinner"></i></div>
      <div class="card-body">
        <span class="card-label">In Progress</span>
        <span class="card-value" id="countProgress">1</span>
      </div>
      <div class="card-trend up"><i class="fa-solid fa-arrow-trend-up"></i> Active now</div>
    </div>

    <div class="card card--completed">
      <div class="card-icon"><i class="fa-solid fa-circle-check"></i></div>
      <div class="card-body">
        <span class="card-label">Completed</span>
        <span class="card-value" id="countCompleted">1</span>
      </div>
      <div class="card-trend up" id="trendCompleted"></div>
    </div>
  </section>

  <div class="panel panel--progress top-row-chart-panel">
    <div class="panel-header">
      <h2>Overall Progress</h2>
      <span class="panel-badge">This Semester</span>
    </div>
    <div class="pie-chart-wrap">
      <div class="real-pie-chart" id="progressPieChart"></div>
    </div>
  </div>

</div>

      <!-- <div class="panel panel--deadlines">
        <div class="panel-header">
          <h2>Upcoming Deadlines</h2>
          <a href="#" class="panel-link">View all</a>
        </div>

        <ul class="deadline-list" id="deadlineList">
          <li class="empty-state">No upcoming deadlines</li>
        </ul>
      </div> -->

    </section>


    <section class="panel panel--tasks">
      <div class="panel-header">
        <h2>Recent Tasks</h2>
        <div class="task-filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="pending">Pending</button>
          <button class="filter-btn" data-filter="progress">In Progress</button>
          <button class="filter-btn" data-filter="completed">Completed</button>

          <select id="sortSelect">
            <option value="default">Sort by...</option>
            <option value="dueDate">Due Date</option>
            <option value="priority">Priority</option>
          </select>
        </div>
      </div>
      <br>
      <!-- Card for tasks -->
      <div id="taskCardContainer" class="task-card-grid">
        <p class="empty-state">No task cards available</p>
      </div>
      <!-- . -->

      <div class="table-wrap">
        <table class="task-table">
          <thead>
            <tr>
              <th>Task Name</th>
              <th>Course</th>
              <th>Due Date</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>


          <tbody id="taskTableBody">
            <tr>
              <td colspan="6" class="empty-state">No tasks found</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="js/dashboard.js"></script>

  <!-- TASK MODAL -->
  <div id="taskModal" class="modal hidden">

    <div class="modal-content">

      <div class="modal-header">
        <h2>Create Task</h2>
        <button id="closeModal" class="close-btn">&times;</button>
      </div>

      <form id="taskForm">

        <input type="text" id="taskTitle" placeholder="Task title" required>

        <input type="text" id="taskCourse" placeholder="Course / Unit">

        <textarea id="taskDescription" placeholder="Description"></textarea>

        <input type="date" id="taskDueDate" required>

        <select id="taskPriority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>

        <button type="submit" class="submit-btn">Create Task</button>

      </form>

    </div>

  </div>
  <!-- EDIT MODAL -->
  <div id="editModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Edit Task</h2>
        <button id="closeEditModal" class="close-btn">&times;</button>
      </div>

      <form id="editForm">
        <input type="hidden" id="editTaskId" />
        <input type="text" id="editTitle" placeholder="Task title" required />
        <input type="text" id="editCourse" placeholder="Course / Unit" />
        <textarea id="editDescription" placeholder="Description"></textarea>
        <input type="date" id="editDueDate" />

        <select id="editPriority">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>

        <select id="editStatus">
          <option value="todo">To Do</option>
          <option value="in-progress">In Progress</option>
          <option value="done">Completed</option>
        </select>

        <button type="submit" class="submit-btn">Save Changes</button>
      </form>
    </div>
  </div>

</body>

</html>
